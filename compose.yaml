# board-reader live-stream demo (M2), orchestrated end-to-end.
#
#   docker compose up --build
#   then open http://localhost:8080  -> a live game replay: positions evolve,
#   the stream bursts through each (synthetic) hand reaching over the board,
#   and idles at a ~1 fps keepalive between moves.
#
# Data flow:  edge --(WS frames)--> inference --(WS position events)--> viewer --> browser
# The browser only ever talks to `viewer`, which relays the node's sockets and HTTP
# API (packages/viewer/.../proxy.py). One origin, so the demo works unchanged over
# https and behind a tunnel.

services:
  inference:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PACKAGE: board-reader-inference
    command: ["board-reader-inference", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      BR_ALLOW_ORIGINS: "*"
      # The trained zero-shot classifier (DESIGN §4.6). models/ is git-ignored
      # (non-redistributable training data licenses); when absent the server
      # degrades gracefully to the stub, so a fresh clone still composes up.
      BR_MODEL: /models/run_e/model.onnx
      # Second cascade member (2026-08-11): squares BR_MODEL is unsure about are
      # re-read by this pose-crop model and averaged — user_photos 0.938→0.956 at
      # ~1.3× cost. Both absent (fresh clone) degrades to the stub like BR_MODEL
      # alone; a partial pair is a hard startup error by design.
      BR_MODEL_B: /models/run_f/model.onnx
      # Every ingested frame is recorded (WP-H2) so the run can be replayed:
      #   board-reader-edge feed --recording recordings/ --throttle
      # Bind-mounted, or the recording would die with the container.
      BR_RECORD_DIR: /recordings
      BR_RECORD_MAX_MB: "4000"
    volumes:
      - ./models:/models:ro
      - ./recordings:/recordings
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 10

  edge:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PACKAGE: board-reader-edge
    # The M2 demo: a synthetic recorded game, looped forever, forwarded
    # adaptively (keepalive at rest, burst through motion — DESIGN D4). Zero
    # external data, O(1) memory. Swap `--game` for `--video /data/clip.mp4`
    # (with a volume, plus `--corners x0,y0,...` for the operator corner-tap)
    # to replay real OTB footage.
    command:
      - board-reader-edge
      - feed
      - --url
      - ws://inference:8000/ingest
      - --game
      - --adaptive
      - --loop
      - --throttle
    depends_on:
      inference:
        condition: service_healthy

  viewer:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PACKAGE: board-reader-viewer
    command: ["board-reader-viewer", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      # The viewer's own hop to the node, over the compose network — the browser never
      # sees these. Every page is same-origin and reaches the node through the viewer's
      # /api and /ws relays, so the published 8000 above is for debugging only; the
      # demo works with it removed.
      BR_INFERENCE_WS: "ws://inference:8000/viewer"
      BR_INFERENCE_HTTP: "http://inference:8000"
    ports:
      - "8080:8080"
    depends_on:
      - inference
