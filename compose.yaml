# board-reader live-stream demo (M2), orchestrated end-to-end.
#
#   docker compose up --build
#   then open http://localhost:8080  -> a live game replay: positions evolve,
#   the stream bursts through each (synthetic) hand reaching over the board,
#   and idles at a ~1 fps keepalive between moves.
#
# Data flow:  edge --(WS frames)--> inference --(WS position events)--> browser
# The browser loads the UI from `viewer` but connects for DATA directly to
# `inference` on the host-published port 8000 (see BR_INFERENCE_WS).

services:
  inference:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PACKAGE: board-reader-inference
    command: ["board-reader-inference", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      BR_ALLOW_ORIGINS: "*"
      # The trained zero-shot classifier (DESIGN §4.6). models/ is git-ignored
      # (non-redistributable training data licenses); when absent the server
      # degrades gracefully to the stub, so a fresh clone still composes up.
      BR_MODEL: /models/run_e/model.onnx
    volumes:
      - ./models:/models:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 10

  edge:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PACKAGE: board-reader-edge
    # The M2 demo: a synthetic recorded game, looped forever, forwarded
    # adaptively (keepalive at rest, burst through motion — DESIGN D4). Zero
    # external data, O(1) memory. Swap `--game` for `--video /data/clip.mp4`
    # (with a volume, plus `--corners x0,y0,...` for the operator corner-tap)
    # to replay real OTB footage.
    command:
      - board-reader-edge
      - feed
      - --url
      - ws://inference:8000/ingest
      - --game
      - --adaptive
      - --loop
      - --throttle
    depends_on:
      inference:
        condition: service_healthy

  viewer:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PACKAGE: board-reader-viewer
    command: ["board-reader-viewer", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      # The browser (on the host) reaches inference via its published port.
      BR_INFERENCE_WS: "ws://localhost:8000/viewer"
      BR_INFERENCE_HTTP: "http://localhost:8000"
    ports:
      - "8080:8080"
    depends_on:
      - inference
