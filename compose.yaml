# board-reader walking skeleton (M0), orchestrated end-to-end.
#
#   docker compose up --build
#   then open http://localhost:8080  -> a live board, fed by the synthetic edge.
#
# Data flow:  edge --(WS frames)--> inference --(WS position events)--> browser
# The browser loads the UI from `viewer` but connects for DATA directly to
# `inference` on the host-published port 8000 (see BR_INFERENCE_WS).

services:
  inference:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PACKAGE: board-reader-inference
    command: ["board-reader-inference", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      BR_ALLOW_ORIGINS: "*"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 10

  edge:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PACKAGE: board-reader-edge
    # Synthetic feed so the demo needs zero external data. Swap for
    # `--video /data/clip.mp4` (with a volume) to replay real OTB footage.
    command:
      - board-reader-edge
      - feed
      - --url
      - ws://inference:8000/ingest
      - --synthetic
      - "0"  # stream forever (lazy, O(1) memory)
      - --fps
      - "2"
      - --throttle
    depends_on:
      inference:
        condition: service_healthy

  viewer:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PACKAGE: board-reader-viewer
    command: ["board-reader-viewer", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      # The browser (on the host) reaches inference via its published port.
      BR_INFERENCE_WS: "ws://localhost:8000/viewer"
    ports:
      - "8080:8080"
    depends_on:
      - inference
