# Virtual workspace root for the board-reader monorepo.
# The deployable code lives in packages/*; this root only ties them together,
# pins the resolver, and holds shared dev tooling. See docs/DESIGN.md.

[tool.uv.workspace]
# Explicit, not `packages/*`: packages/viewer is a Node package,
# and a glob would demand a pyproject.toml there.
members = ["packages/core", "packages/edge", "packages/inference"]

[tool.uv]
# Supply-chain hardening: 7-day dependency "seasoning". Only resolve to releases
# published on or before this date (today minus 7 days), so freshly-published
# (potentially compromised) versions are never pulled. Bump deliberately.
exclude-newer = "2026-06-09T00:00:00Z"
# A deliberate per-package bump, still seasoned 7 days: YouTube breaks old yt-dlp
# releases within weeks (2026.3.17, the newest before the date above, resolves
# URLs that googlevideo answers with 403), so the edge's stream source needs a
# recent one. Bump this date together with the yt-dlp floor in packages/edge.
exclude-newer-package = { yt-dlp = "2026-11-18T00:00:00Z" }

[tool.uv.sources]
board-reader-core = { workspace = true }
board-reader-edge = { workspace = true }
board-reader-inference = { workspace = true }

[dependency-groups]
# Installed into the workspace venv for local dev + the test suite.
dev = [
    "board-reader-core",
    "board-reader-edge",
    "board-reader-inference",
    "pytest>=8",
    # Parallel test execution (`make test` / `pytest -n auto`). The suite is
    # CPU-bound and independent per test, so this roughly halves wall clock.
    "pytest-xdist>=3",
    "httpx>=0.27",
    # compose.yaml is parsed by a guardrail test
    # (tests/test_deploy_parity.py). Already in the lock as a transitive dep, so
    # declaring it resolves to the same pinned version — no new surface.
    "pyyaml>=6",
    # The lint gate (`make lint`). Pinned into the dev group rather than run via
    # `uvx` so every checkout and every agent lints with the same version — a
    # gate whose ruleset drifts by machine is not a gate.
    "ruff>=0.14",
]

[tool.ruff]
line-length = 92  # what the code already sits at; not a reformat mandate
extend-exclude = ["scratch", "data", "models"]

[tool.ruff.lint]
# Chosen to match how this code is already written, not to import a house style
# from elsewhere. Anything that would have churned working code for taste was
# left out; everything kept either catches a real defect class or enforces a
# convention the codebase already follows.
extend-select = [
    "I",      # import sorting — encodes the layering below
    "UP",     # pyupgrade: this is a 3.12-only workspace
    "B",      # bugbear
    "SIM",    # simplify
    "C4",     # comprehensions
    "RUF",    # ruff's own
    "DTZ",    # naive datetimes — `utc` is a wire field here (D5), so this matters
]
# Not selected: TRY004 (TypeError for a type check). `ValueError` is this
# codebase's boundary-error currency — the CLIs catch it to turn a
# misconfiguration into one clean line instead of a traceback, and
# `labels.parse_corners` documents raising it for a non-string on purpose so a
# pre-corners label is skipped rather than fatal. Both findings were deliberate,
# so the rule described a convention we do not hold rather than a defect.
ignore = [
    # Boundary code deliberately catches everything and degrades: a bad model
    # file, a half-written sidecar or an unreadable bank must not take the
    # server down. Those sites are individually commented with what they absorb
    # and why; a blanket rule here would only breed `# noqa` noise.
    "BLE001",
    "S110",
    # Best-effort persistence (upload retention, session-bank writes) is written
    # as try/except-pass on purpose — retention must never fail a request.
    "SIM105",
    # The prose here uses real typography (en dashes, ×, −) and `tools/video`
    # maps filename-hostile characters onto fullwidth lookalikes (｜ ⧸ ＼) on
    # purpose. "Fixing" those would corrupt the very strings that exist to be
    # different from ASCII.
    "RUF001",
    "RUF002",
    "RUF003",
    # zip-without-explicit-strict: worth doing, but the honest fix is `strict=True`
    # at each of the ~19 sites after checking that the operands really are the same
    # length — a correctness review, not a lint sweep. Ruff's autofix writes
    # `strict=False`, which is pure noise and would make the real review harder to
    # spot later. Left as a tracked follow-up rather than papered over.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals and repeat themselves on purpose; a test that is
# clever is a test that is wrong.
"**/tests/**" = ["B011", "RUF059"]
# `tools/` are operator scripts, not library code: shebangs without the exec bit
# and top-level side effects are normal there.
"tools/**" = ["EXE001"]

[tool.ruff.lint.isort]
# The import blocks encode the architecture, so the linter is taught it rather
# than allowed to flatten it: `board_reader_core` is the shared contract every
# node imports, and it gets its own section ABOVE the node packages. A diff that
# moves a core import down into a node's block is a layering smell, and this is
# what makes that visible. See CLAUDE.md "the separation rule".
known-first-party = ["board_reader_core"]
known-local-folder = [
    "board_reader_edge",
    "board_reader_inference",
]

[tool.pytest.ini_options]
# tools/video joins the workspace suite (it needs only numpy+cv2, which core
# already pulls in).
testpaths = [
    "tests",
    "packages",
    "tools/video/tests",
]
# `gpu` marks the tests that build a real ONNX InferenceSession and so take the
# CUDA execution provider. They are correctness tests, not perf tests — but they
# are the only ones that fail for reasons outside the code (GPU memory
# contention from a training run or a second agent session). `make test`
# deselects them and says so; `make test-gpu` runs exactly them.
markers = ["gpu: needs the GPU (real ONNX InferenceSession); deselected by `make test`"]
# A hung test must never again be a silent hang. The suite's slowest test is ~8s,
# so 120s means "something is wedged, not slow": faulthandler dumps every thread's
# stack to stderr and names the test, turning a run that sits there for a quarter
# of an hour with no output into one that says where it is stuck. Diagnosis only —
# it does not fail or kill the test, so it can never make a green run red.
#
# The hang this was written for: `WS /ingest` acks on *receipt* and estimates on a
# worker task, and Starlette's TestClient tears the event loop down under that
# worker (see packages/inference/tests/conftest.py). A test that then read the
# retained position off `WS /viewer` waited forever for an event nobody would
# publish. Fixed at the source there; this is the net under it.
faulthandler_timeout = 120
filterwarnings = [
    # Starlette's TestClient warns about httpx vs httpx2; harmless for our suite.
    "ignore:Using `httpx` with `starlette.testclient`",
    # uvicorn still drives the legacy websockets API; not our code.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
    "ignore:remove second argument of ws_handler:DeprecationWarning",
]
