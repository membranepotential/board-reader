# Leave-style-out ResNet-18 (the first full experiment once >=4 styles exist).
# Run once per holdout style, rotating, then average; final numbers via evaluate.py
# on the user's own photos.
styles: ["all"]
holdout: null            # override per run: --holdout <style>
max_boards: null
require_mode: board      # only deployed-geometry styles (excludes crop-only zenodo)

model: resnet18          # or resnet50
init: imagenet           # imagenet | scratch | sin (Stylized-ImageNet resnet50)
# sin_weights: models/resnet50_train_60_epochs-...-SIN.pth.tar   # for init: sin
shape_bias: true         # texture-destroying + AdaIN-approx stylization augmentation

epochs: 25
batch_size: 96           # fits a 4 GB card with AMP; drop to 64 if OOM
lr: 0.0005
weight_decay: 0.05
warmup_frac: 0.05

device: auto
amp: true
num_workers: 4
seed: 0
out_dir: "scratch/runs/loso_resnet"
