# Cloud smoke — proves the RunPod loop end to end for pennies (Phase 1.4 of
# docs/plans/2026-08-28-runpod-migration.md): staged cache found -> train (loss
# falls) -> export -> evaluate. Uses run_g's geometry+mask so it reads the
# hr1.6_sp0.15_maskgray cache that `rp stage` ships — no smoke-only cache.
styles: ["chessred"]
require_mode: board
holdout: null            # single style -> leave-groups-out (holds out whole games)
max_boards: 96
val_frac: 0.25

model: resnet18
init: imagenet

headroom: 1.6
side_pad: 0.15
mask: gray

epochs: 2
batch_size: 32
lr: 0.0005
weight_decay: 0.05
steps_per_epoch: 40

device: auto
amp: true                # smoke doesn't gate on accuracy; exercise the fast path
num_workers: 4
seed: 0
out_dir: "scratch/runs/smoke_cloud"
