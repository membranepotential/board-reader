# Leave-style-out DINOv2-S, last-2-blocks fine-tune + linear head.
# Same protocol as loso_resnet; the backbone is the deployed Apache-2.0 ViT-S/14.
styles: ["all"]
holdout: chessr_vlab_wooden   # clean synthetic holdout (chesscog_transfer data is broken)
max_boards: null
require_mode: board      # only deployed-geometry styles (excludes crop-only zenodo)

model: dinov2
unfreeze_blocks: 2       # 0 -> pure linear probe (known to tie kNN; see DESIGN §4.6)
freeze_backbone: true
shape_bias: true         # texture-destroying + AdaIN-approx stylization augmentation

epochs: 12
patience: 4
batch_size: 16           # fp32 on 4GB card w/ lc0 holding 1GB -> bs16 fits
lr: 0.0002
weight_decay: 0.05
steps_per_epoch: 250     # fast per-epoch val cadence
warmup_frac: 0.1

device: auto
amp: false               # fp32: fastest AND correct on this Turing card (fp16 NaNs, bf16 emulated/slow)
num_workers: 8
seed: 0
out_dir: "scratch/runs/loso_dinov2"
