# Experiment (b): ResNet-50 initialised from Stylized-ImageNet weights
# (rgeirhos/texture-vs-shape) — starts already shape-biased, then fine-tuned across
# our styles. Same protocol as val_chesscog. The sin_weights checkpoint is NOT
# redistributed here — download it from the texture-vs-shape release and drop it
# under scratch/weights/ (git-ignored), which is where this config expects it.
styles: ["all"]
require_mode: board
holdout: chessr_vlab_wooden   # clean synthetic holdout (chesscog_transfer data is broken)

model: resnet50
init: sin
# Repo-relative; scratch/ is git-ignored. Fetch the checkpoint from
# https://github.com/rgeirhos/texture-vs-shape (Stylized-ImageNet ResNet-50).
sin_weights: "scratch/weights/resnet50_train_45_epochs_combined_IN_SF-2a0d100e.pth.tar"
shape_bias: true

epochs: 16
patience: 5
batch_size: 16           # fp32 on 4GB card w/ lc0 holding 1GB -> bs16 fits
lr: 0.0003
weight_decay: 0.05
steps_per_epoch: 250     # fast per-epoch val cadence (like run a)
warmup_frac: 0.05

device: auto
amp: false               # fp32: fastest AND correct on this Turing card (fp16 NaNs, bf16 emulated/slow)
num_workers: 8
seed: 0
out_dir: "scratch/runs/loso_resnet_sin"
