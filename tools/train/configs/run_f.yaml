# Run (f) — the pose-aware crop bet. Identical to run_e in every other respect
# (same 11 styles, same holdout, same optimiser, same seed) so the ONLY variable
# is the crop geometry: bbox hr1.6/sp0.15 -> a projected piece prism.
#
# Why: every geometry ever tried, including the deployed hr1.6, is an
# axis-aligned bbox extended along fixed IMAGE axes by a multiple of the
# square's projected WIDTH. A square's projected width shrinks with camera
# elevation while a real piece's projected height does not, so one scalar
# cannot cover both a steep and a shallow view — the documented steep+dim
# decapitation that hr1.6 only patched. PoseGeometry recovers the camera pose
# from the board homography and projects a piece-sized prism instead.
#
# piece_height 1.9 / piece_radius 0.5 are board units (1 = one square width),
# from real Staunton proportions: a tournament king is ~95mm on a ~57mm square
# (1.67), plus margin; a piece base is ~0.5 squares across.
#
# Baselines to beat (run_e, same styles/holdout):
#   holdout chessr_vlab_wooden   0.898 per-square
#   chesscog_transfer (unseen real photos, repaired 2026-08-07)   0.819
styles: ["all"]
require_mode: board
holdout: chessr_vlab_wooden

crop_geometry:
  kind: pose
  piece_height: 1.9
  piece_radius: 0.5
  focal_ratio: 1.0

model: resnet18
init: imagenet
shape_bias: true

epochs: 20
# 8, not 5: run_e's curve rises to e17 (0.898) with a 3-epoch stall at e8-e10, and
# run_f's first attempt died at e8 on a 4-epoch stall having peaked at 0.847 — an
# early stop that answered nothing. On a 40-minute run patience buys almost no
# compute back, so set it wide enough that only a genuinely dead run trips it.
patience: 8
batch_size: 48
lr: 0.0005
weight_decay: 0.05
steps_per_epoch: 300
warmup_frac: 0.05

# fp32 only: on this Turing card (GTX 1650) fp16 autocast produces NaN in the
# FORWARD pass (GradScaler cannot help — it only rescales the backward) and runs
# 3x slower than fp32; bf16 is emulated and ~2.7x slower. Measured, not assumed.
device: auto
amp: false
num_workers: 8
seed: 0
out_dir: "scratch/runs/run_f"
