# run_h (E7 masked pose member) for the cloud — identical to run_h except the
# styles are EXPLICIT (run_h.sh's STYLES order) so pod-side resolution cannot
# drift from what the local driver would have trained; see run_g_cloud.yaml.
# Baselines: run_f 0.894 holdout / run_e 0.898; chesscog_transfer 0.819 (run_e).
styles:
  - chessred
  - chessrender360
  - chessr_cana
  - chessr_russiangreytown
  - chessr_vlab_wooden
  - w2_bellanger
  - w2_cemkalyoncu
  - w2_chessr_cana
  - w2_chessr_rgt
  - w2_pjhanzlik
  - w2_polyhaven
require_mode: board
holdout: chessr_vlab_wooden

model: resnet18
init: imagenet
shape_bias: true

crop_geometry:
  kind: pose
  piece_height: 1.9
  piece_radius: 0.5
  focal_ratio: 1.0
mask: gray

epochs: 20
patience: 5
batch_size: 48
lr: 0.0005
weight_decay: 0.05
steps_per_epoch: 300
warmup_frac: 0.05

device: auto
amp: false
num_workers: 4
seed: 0
out_dir: "scratch/runs/run_h_cloud"
