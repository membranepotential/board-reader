# Headroom sweep d16: headroom=1.6 (crop_squares_photo's own "whole standing piece"
# default) to stop decapitating tall pieces at steep angles. Otherwise run (a)'s recipe.
styles: ["all"]
require_mode: board
holdout: chessr_vlab_wooden

model: resnet18
init: imagenet
shape_bias: true

headroom: 1.6
side_pad: 0.15

epochs: 18
patience: 5
batch_size: 48
lr: 0.0005
weight_decay: 0.05
steps_per_epoch: 250
warmup_frac: 0.05

device: auto
amp: false               # fp32 (fp16 NaNs / bf16 emulated on this Turing card)
num_workers: 8
seed: 0
out_dir: "scratch/runs/d16"
