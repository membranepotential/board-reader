# Run (i) — Phase 3.1 of docs/plans/2026-08-28-runpod-migration.md: run_g with
# the wall-clock cap removed. run_g saw 300 x 48 = 14,400 images/epoch of a
# 663,680-image pool — 2.2 % per epoch, under half the data seen once across
# the whole run. That cap was a GTX 1650 artefact, not a modelling decision.
# steps_per_epoch: null -> a true epoch (~13.8k steps at batch 48); patience
# does the stopping. Cloud-only: never runnable locally (~22 h/epoch).
#
# Launch AFTER the Phase 1.5 parity gate; revisit amp/batch once the Phase 2
# grid lands (this file deliberately keeps run_g's amp:false until then so the
# only variable vs run_g is data volume).
#
# Baselines: run_g (masked, capped) holdout 0.8983 / chesscog_transfer 0.851.
styles: ["all"]
require_mode: board
holdout: chessr_vlab_wooden

model: resnet18
init: imagenet
shape_bias: true

headroom: 1.6
side_pad: 0.15
mask: gray

epochs: 20
patience: 5
batch_size: 48
lr: 0.0005
weight_decay: 0.05
steps_per_epoch: null
warmup_frac: 0.05

device: auto
amp: false
num_workers: 4
seed: 0
out_dir: "scratch/runs/run_i"
