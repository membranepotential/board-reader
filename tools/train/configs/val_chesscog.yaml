# Two-tier eval setup (team lead's recommendation):
#   train  = all OTHER board-geometry styles (chessred + CR360 + synthetic as they land)
#   val    = chesscog_transfer (22 real photos of a set seen nowhere in training)
#   test   = the operator's photos + data/uploads (evaluate.py; touch ONLY for final reporting)
# Tune hyperparameters against the val number here; report the test number separately.
styles: ["all"]
require_mode: board
holdout: chesscog_transfer   # unseen validation style

model: resnet18
init: imagenet
shape_bias: true

epochs: 18
patience: 5            # early-stop on val-accuracy plateau
batch_size: 48
lr: 0.0005
weight_decay: 0.05
steps_per_epoch: 250   # ~1.6 min/epoch on fp32 -> fast per-epoch val cadence, ~30 min total
warmup_frac: 0.05

device: auto
# fp32: fp16 autocast NaNs in the FORWARD pass on this GTX 1650 even WITH GradScaler
# (0/30 finite, verified) and is slower (0.78 vs 2.63 steps/s); bf16 is emulated/slow.
amp: false
num_workers: 8
seed: 0
out_dir: "scratch/runs/val_chesscog"
