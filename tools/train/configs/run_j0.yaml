# Run (j0) — the auto-label plan's Stage 0 null hypothesis, on the pod.
#
# docs/plans/2026-08-31-autolabel-engine.md §"Stage 0": before anyone builds the
# Viterbi decoder, measure whether HAND-PERFECT labels from the seven recorded
# takes move the ship gates at all. If they do not, auto-generated ones will not
# either, and the 7.5-day decoder build is not justified.
#
# The recipe is run_e.yaml verbatim (deployed geometry hr1.6/sp0.15, unmasked,
# resnet18/imagenet, 20 epochs, 300 steps, batch 48, lr 5e-4, seed 0) — the ONLY
# change is the seven `ht_*` crop-level styles appended to the mix.
#
# Three deliberate deviations from run_e.yaml's text, none of them to the recipe:
#
# - `styles` is an EXPLICIT list, not ["all"]. "all" resolves through the raw
#   registry locally and through the cache scan on a pod, and the two orders
#   differ (run_g_cloud.yaml carries the same note); it would also silently
#   sweep in whatever else has landed under data/external since run_e was
#   trained. The first eleven are exactly run_e's mix, in run_g_cloud's order.
# - `require_mode` is dropped (run_e.yaml has "board"). It only filters style
#   DISCOVERY, and the ht_* styles are crop-level (trial.export_crops emits
#   already-cut 224px squares) — with require_mode: board they would be filtered
#   out of the explicit list's own resolution. Listing styles explicitly makes
#   the filter redundant anyway.
# - `holdout` stays the synthetic chessr_vlab_wooden, so every ht_* style is in
#   TRAIN. The gate for this run is not the holdout — it is the local 4-take
#   replay + curated gates (tools/train/gates.sh), per G5.
#
# GATE-SESSION CONTAMINATION, stated up front (plan G6): four of the seven
# ht_* styles come from the very takes gates.sh replays. Stage 0 asks "can these
# frames help at all", so training on them is the point; but the replay rows
# this run produces are NOT a clean generalization measurement, and the report
# must say so. G6's --allow-gate-sessions guard belongs to Stage 5's exporter.
styles:
  # run_e's eleven, in run_g_cloud.yaml's order (board-level, synthetic + ChessReD)
  - chessred
  - chessrender360
  - chessr_cana
  - chessr_russiangreytown
  - chessr_vlab_wooden
  - w2_bellanger
  - w2_cemkalyoncu
  - w2_chessr_cana
  - w2_chessr_rgt
  - w2_pjhanzlik
  - w2_polyhaven
  # the seven hand-truthed takes (crop-level, cut at the deployed geometry by
  # board_reader_inference.trial.export_crops; data/external/trial_handtruth/)
  - ht_20260813_193308_phone
  - ht_20260827_163352_phone
  - ht_20260827_170333_phone
  - ht_20260827_172736_phone
  - ht_20260827_175539_phone
  - ht_20260827_181802_phone
  - ht_20260828_111421_phone
holdout: chessr_vlab_wooden

model: resnet18
init: imagenet
shape_bias: true

headroom: 1.6
side_pad: 0.15

epochs: 20
patience: 5
batch_size: 48
lr: 0.0005
weight_decay: 0.05
steps_per_epoch: 300
warmup_frac: 0.05

device: auto
amp: false
# The pod is loader-bound and peaks at ~1.3 workers/vCPU (README "Cloud perf").
num_workers: 8
seed: 0
out_dir: "scratch/runs/run_j0"
