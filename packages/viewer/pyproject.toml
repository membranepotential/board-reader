[project]
name = "board-reader-viewer"
version = "0.1.0"
description = "board-reader viewer: serves the live-position web UI (data comes from inference over WS)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
board-reader-viewer = "board_reader_viewer.server:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
