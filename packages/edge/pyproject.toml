[project]
name = "board-reader-edge"
version = "0.1.0"
description = "board-reader edge node (the Pi): capture, crop and forward frames"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "board-reader-core",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "websockets>=12",
    # The `camera` command's stream source: resolves a YouTube (or other) page to a
    # media URL OpenCV reads. yt-dlp-ejs carries the scripts it runs (in deno) to
    # answer YouTube's JS challenges; without them formats go missing.
    "yt-dlp>=2026.10.26",
    "yt-dlp-ejs>=0.8",
]

[project.scripts]
board-reader-edge = "board_reader_edge.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
