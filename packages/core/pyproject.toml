[project]
name = "board-reader-core"
version = "0.1.0"
description = "Shared contract for board-reader: L3 position protocol, L1->L2 wire format, sim helpers"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
